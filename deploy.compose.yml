services:
  api:
    build: .
    env_file: .env.production
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "--import", "tsx", "server/worker.ts"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: runningtab
      POSTGRES_DB: runningtab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runningtab -d runningtab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  database:
