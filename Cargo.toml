[workspace]
members = ["crates/tab-core", "crates/tab-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "=0.13.5", features = ["blocking", "json"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
keyring = "=4.2.0"
