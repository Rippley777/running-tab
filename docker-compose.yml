services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: runningtab
      POSTGRES_PASSWORD: runningtab
      POSTGRES_DB: runningtab
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runningtab"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres:
